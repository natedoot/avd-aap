!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$ViCjfR5/45mDVAaB$qP2hoaKkM/jds67sbX95PL4pcoKD3ZNQ5za8B2kbIQQ8mVDJpC1zUI.hBW2MEzCWZRMVXPYEWCixPyhWB6PxH.
username cvpadmin privilege 15 role network-admin secret sha512 $6$JIWpYntS5KpTMCGF$el6rGKnDYPqxKeMcJGutPctkOMiHrV/bej1DTmdTR8jEnuV/gQbTYa76slNHP1vwyN8Gq2kbNsMmXUwVhkwjy1
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=apiserver.arista.io:443 -cvauth=token-secure,/tmp/cv-onboarding-token -cvvrf=default -disableaaa -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -taillogs
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname dc1-leaf1b
ip name-server vrf default 169.254.169.254
!
spanning-tree mode mstp
no spanning-tree vlan-id 4093-4094
spanning-tree mst 0 priority 4096
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
management api http-commands
   protocol https
   protocol http
   no shutdown
   !
   vrf default
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel3
   description MLAG_dc1-leaf1a_Port-Channel3
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description P2P_dc1-spine1_Ethernet2
   no shutdown
   mtu 1500
   no switchport
   ip address 1.1.255.5/31
!
interface Ethernet2
   description P2P_dc1-spine2_Ethernet2
   no shutdown
   mtu 1500
   no switchport
   ip address 1.1.255.7/31
!
interface Ethernet3
   description MLAG_dc1-leaf1a_Ethernet3
   no shutdown
   channel-group 3 mode active
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 1.1.0.4/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 1.1.1.3/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   ip address 192.168.0.104/24
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 1.1.1.97/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 1.1.1.65/31
!
interface Vxlan1
   description dc1-leaf1b_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 1.1.0.0/27 eq 32
   seq 20 permit 1.1.1.0/27 eq 32
!
mlag configuration
   domain-id DC1_L3_LEAF1
   local-interface Vlan4094
   peer-address 1.1.1.64
   peer-link Port-Channel3
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ntp local-interface Management1
ntp server pool.ntp.org prefer iburst
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65101
   router-id 1.1.0.4
   update wait-install
   no bgp default ipv4-unicast
   maximum-paths 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65101
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description dc1-leaf1a
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 1.1.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 1.1.0.1 remote-as 65100
   neighbor 1.1.0.1 description dc1-spine1_Loopback0
   neighbor 1.1.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 1.1.0.2 remote-as 65100
   neighbor 1.1.0.2 description dc1-spine2_Loopback0
   neighbor 1.1.1.96 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 1.1.1.96 description dc1-leaf1a_Vlan4093
   neighbor 1.1.255.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 1.1.255.4 remote-as 65100
   neighbor 1.1.255.4 description dc1-spine1_Ethernet2
   neighbor 1.1.255.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 1.1.255.6 remote-as 65100
   neighbor 1.1.255.6 description dc1-spine2_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
!
end
