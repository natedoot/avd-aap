name: Validate EOS State with ANTA

on:
  workflow_run:
    workflows:
      - Build and Deploy to CV
    types:
      - completed

permissions:
  contents: write

jobs:
  validate-state:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pyavd[ansible]"

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install arista.avd ansible.scm --force

      - name: Run ANTA validation playbook
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTA_USERNAME: ${{ secrets.ANTA_USERNAME }}
          ANTA_PASSWORD: ${{ secrets.ANTA_PASSWORD }}
        run: |
          set -euo pipefail
          ansible-playbook -i inventory.yml playbooks/validate-state.yml
