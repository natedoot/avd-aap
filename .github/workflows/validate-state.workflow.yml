name: Validate EOS State with ANTA

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/intended/**'
      - 'artifacts/documentation/**'
      - 'playbooks/validate-state.yml'

permissions:
  contents: write

jobs:
  validate-state:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pyavd[ansible]"

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install arista.avd ansible.scm --force

      - name: Verify GitHub token exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is empty"
            exit 1
          fi
          echo "GITHUB_TOKEN is set"

      - name: Run ANTA validation playbook
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTA_USERNAME: ${{ secrets.ANTA_USERNAME }}
          ANTA_PASSWORD: ${{ secrets.ANTA_PASSWORD }}
        run: |
          set -euo pipefail
          ansible-playbook -i act-inventory.yml playbooks/validate-state.yml
