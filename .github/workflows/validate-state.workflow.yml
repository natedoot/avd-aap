name: Validate EOS State with ANTA

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/intended/**'
      - 'artifacts/documentation/**'
      - 'playbooks/validate-state.yml'

permissions:
  contents: write

jobs:
  validate-state:
    runs-on:
      - self-hosted
      - lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pyavd[ansible]"

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install arista.avd ansible.scm

      - name: Run ANTA validation playbook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
          ANTA_USERNAME: ${{ secrets.ANTA_USERNAME }}
          ANTA_PASSWORD: ${{ secrets.ANTA_PASSWORD }}
        run: |
          set -euo pipefail
          ansible-playbook -i inventory.yml playbooks/validate-state.yml
