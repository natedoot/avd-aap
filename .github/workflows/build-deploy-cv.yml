name: Build and Deploy to CV

on:
  push:
    branches:
      - main
    paths:
      - 'playbooks/group_vars/**'

permissions:
  contents: write

jobs:
  validate-state:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pyavd[ansible]"

      - name: Install Ansible collections
        run: |
          set -euo pipefail
          ansible-galaxy collection install arista.avd ansible.scm --force

      - name: Verify GitHub token exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is empty"
            exit 1
          fi
          echo "GITHUB_TOKEN is set"

      - name: Run build and deploy playbook
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ansible-playbook -i inventory.yml playbooks/build-deploy.yml
