---
- name: Update Arista fabric configuration
  hosts: DC1_FABRIC
  connection: local
  gather_facts: false
  collections:
    - arista.avd
    - ansible.scm
  vars:
    fabric_dir_name: "{{ fabric_name }}"
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    cv_token: "{{ lookup('env', 'CV_TOKEN') }}"

  tasks:
    - name: Retrieve a repository from a distant location and make it available to the local EE
      ansible.scm.git_retrieve:
        origin:
          url: "https://github.com/natedoot/avd-aap.git"
        parent_directory: /tmp/
        branch:
          name: main
          duplicate_detection: no
      register: repository
      delegate_to: localhost
      run_once: true

    - name: Generate intended variables
      include_role:
        name: eos_designs

    - name: Generate device intended config and documentation
      include_role:
        name: eos_cli_config_gen

    - name: copy
      ansible.builtin.copy:
        dest: '{{ item.dest }}'
        src: '{{ item.src }}'
        force: true
      delegate_to: localhost
      run_once: true
      loop:
      - dest: /tmp/avd/intended/
        src:  /runner/intended/structured_configs
      - dest: /tmp/avd/intended/
        src:  /runner/intended/configs
      - dest: /tmp/avd/documentation/
        src:  /runner/documentation/DC1_FABRIC

    - name: Publish the changes
      ansible.scm.git_publish:
        path: "{{ repository['path'] }}"
        token: "{{ github_token }}"
        user:
          name: "natedoot"
          email: "nate.shaw@arista.com"
      delegate_to: localhost
      run_once: true
    
    - name: Provision CV with AVD configuration
      include_role:
        name: cv_deploy
      vars:
        cv_server: www.cv-prod-us-central1-b.arista.io
