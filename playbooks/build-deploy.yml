---
- name: Update Arista fabric configuration
  hosts: DC1_FABRIC
  connection: local
  gather_facts: false
  collections:
    - arista.avd
  vars:
    fabric_dir_name: "{{ fabric_name }}"
    cv_token: "{{ lookup('env', 'CV_TOKEN') }}"

  tasks:
    - name: Show playbook dir
      ansible.builtin.debug:
        var: playbook_dir

    - name: Show inventory file
      ansible.builtin.debug:
        var: inventory_file

    - name: Show inventory dir
      ansible.builtin.debug:
        var: inventory_dir

    - name: Show group names for first host
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          groups: "{{ group_names }}"
      run_once: true

    - name: Show a variable you changed in group_vars
      ansible.builtin.debug:
        var: some_var_you_recently_changed
      run_once: true

    - name: Generate intended variables
      include_role:
        name: eos_designs

    - name: Generate device intended config and documentation
      include_role:
        name: eos_cli_config_gen

    - name: Provision CV with AVD configuration
      include_role:
        name: cv_deploy
      vars:
        cv_server: www.cv-prod-us-central1-b.arista.io
