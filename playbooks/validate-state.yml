---
- name: Test Arista fabric state
  hosts: all
  connection: local
  gather_facts: false
  collections:
    - arista.avd
    - ansible.scm

  vars:
    artifacts_repository: "https://github.com/natedoot/avd-aap.git"
    artifacts_branch: "main"
    artifacts_folder: "artifacts"
    anta_folder: "anta"
    fail_on_anta_failure: true

    github_pat: "{{ lookup('env', 'GITHUB_TOKEN') }}"
    github_run_id: "{{ lookup('env', 'GITHUB_RUN_ID') | default('unknown', true) }}"
    github_repository: "{{ lookup('env', 'GITHUB_REPOSITORY') | default('unknown', true) }}"
    github_sha: "{{ lookup('env', 'GITHUB_SHA') | default('unknown', true) }}"

  tasks:
    - name: Build commit metadata
      delegate_to: localhost
      run_once: true
      ansible.builtin.set_fact:
        changes_name: "Update ANTA validation results from GitHub Actions"
        changes_description: |
          Repository: {{ github_repository }}
          Run ID: {{ github_run_id }}
          Commit: {{ github_sha }}
        anta_validation_failed: false

    - name: Retrieve latest artifacts repository
      delegate_to: localhost
      run_once: true
      ansible.scm.git_retrieve:
        origin:
          url: "{{ artifacts_repository }}"
        branch:
          name: "{{ artifacts_branch }}"
          duplicate_detection: false
      register: repository

    - name: Build ANTA paths
      delegate_to: localhost
      run_once: true
      ansible.builtin.set_fact:
        artifacts_root_dir: "{{ repository.path }}/{{ artifacts_folder }}"
        anta_root_dir: "{{ repository.path }}/{{ artifacts_folder }}"
        anta_base_dir: "{{ repository.path }}/{{ artifacts_folder }}/{{ anta_folder }}"
        anta_reports_dir: "{{ repository.path }}/{{ artifacts_folder }}/{{ anta_folder }}/reports"
        anta_logs_dir: "{{ repository.path }}/{{ artifacts_folder }}/{{ anta_folder }}/logs"
        anta_avd_catalogs_dir: "{{ repository.path }}/{{ artifacts_folder }}/{{ anta_folder }}/avd_catalogs"

    - name: Remove previous ANTA reports and logs
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ anta_reports_dir }}"
        - "{{ anta_logs_dir }}"

    - name: Ensure ANTA artifact directories exist
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ artifacts_root_dir }}"
        - "{{ anta_base_dir }}"
        - "{{ anta_avd_catalogs_dir }}"
        - "{{ anta_reports_dir }}"
        - "{{ anta_logs_dir }}"

    - name: Run ANTA validation and always publish artifacts
      block:
        - name: Test network states
          ansible.builtin.import_role:
            name: anta_runner
          vars:
            root_dir: "{{ anta_root_dir }}"

      rescue:
        - name: Mark ANTA validation as failed
          delegate_to: localhost
          run_once: true
          ansible.builtin.set_fact:
            anta_validation_failed: true

        - name: Report validation failure before publishing
          delegate_to: localhost
          run_once: true
          ansible.builtin.debug:
            msg:
              - "ANTA validation reported failures."
              - "Artifacts will still be published."
              - "Reports directory: {{ anta_reports_dir }}"
              - "Logs directory: {{ anta_logs_dir }}"

      always:
        - name: Publish ANTA artifacts
          run_once: true
          delegate_to: localhost
          ansible.scm.git_publish:
            commit:
              message: |
                {{ changes_name }}

                {{ changes_description }}
            token: "{{ github_pat }}"
            path: "{{ repository.path }}"
            include:
              - "{{ artifacts_folder }}/{{ anta_folder }}"

    - name: Fail play after publishing if ANTA validation failed
      delegate_to: localhost
      run_once: true
      ansible.builtin.fail:
        msg: >-
          ANTA validation failed, but artifacts were published successfully to
          {{ artifacts_repository }} on branch {{ artifacts_branch }}.
      when:
        - anta_validation_failed | bool
        - fail_on_anta_failure | bool
